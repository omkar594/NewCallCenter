; =========================================================================
; Realtime family mapping - required alongside sorcery.conf
; =========================================================================
;
; sorcery.conf tells res_pjsip's endpoint/auth/aor objects to fall through to a "realtime"
; wizard for the family names below; THIS file is what actually resolves "ps_endpoints" etc.
; into a real driver + config section. Without this file, sorcery's realtime wizard has
; nothing to route to and every realtime lookup silently returns "no rows found" even with a
; correctly-configured res_pgsql.conf.
;
; "pgsql" here is the res_config_pgsql driver; "general" is the [general] section name inside
; res_pgsql.conf where the actual Postgres connection details live.

[settings]
ps_endpoints => pgsql,general
ps_auths => pgsql,general
ps_aors => pgsql,general
ps_contacts => pgsql,general

; Per-tenant agent queues. Asterisk has no AMI command to create a queue, so one queue per client
; - the only way to guarantee Client A's caller can never be answered by Client B's agent - can
; only come from realtime. Rows are written to the `queues` table by
; backend/services/tenantQueueService.js (and by a BEFORE INSERT trigger on tenants) at onboarding.
;
; `queue_members` is mapped but intentionally stays EMPTY: membership is dynamic via AMI
; QueueAdd/QueueRemove (queues.conf sets persistentmembers=no, and Postgres
; agent_profiles.current_status is the single source of truth). Asterisk still needs the family to
; resolve when queues are realtime, so omitting this line breaks queue lookups even though nothing
; ever reads a row from it.
queues => pgsql,general
queue_members => pgsql,general
