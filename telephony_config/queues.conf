; =========================================================================
; Asterisk Queue Config - Workstream 7 (press-1-to-agent transfer)
; =========================================================================
;
; No static "member => ..." lines on purpose - membership is 100% dynamic via AMI QueueAdd/
; QueueRemove, driven by backend/services/queueMembershipService.js keeping each queue in sync
; with agent_profiles.current_status. Postgres is the single source of truth for who's idle;
; the queues are just a live mirror of it.
;
; QUEUE DEFINITIONS NOW LIVE IN POSTGRES, NOT HERE. Each tenant has its own queue
; (agents_<tenant uuid>), created at onboarding and read back over Asterisk Realtime - see the
; `queues` table in database/schema.sql and the queues/queue_members families in extconfig.conf.
; This file keeps only the [general] section, whose settings are global and are NOT per-queue.
;
; Why: there used to be exactly one queue here, [campaign_agents], shared by every tenant. Since
; membership is driven purely by agent status with no tenant filter, Client A's caller pressing 1
; could be - and eventually would be - answered by Client B's agent, who would then be talking to
; another company's customer. No amount of application-level checking fixes that reliably; the
; queue itself has to be per-tenant.

[general]
persistentmembers = no
; Deliberate: with the default `yes`, Asterisk's AstDB would remember queue membership across
; an Asterisk restart independently of Postgres, so a restarted PBX could resurrect a member
; whose Postgres status has since moved on (or vice versa). `no` means the queue comes back
; EMPTY after every restart, and the AMI 'ami_ready' resync (server.js ->
; queueMembershipService.resyncAllIdleAgents) is what repopulates it from Postgres - making
; Postgres authoritative instead of two independently-persisted membership lists drifting apart.
autofill = yes

; TRANSITIONAL - the old single shared queue, kept ONLY as a rollback while the realtime
; per-tenant queues are being verified on the box ("queue show agents_<tenanthex>" must resolve).
; Delete this whole section once that check passes; nothing points at it any more, because the
; queue name now arrives per call as ${AGENT_QUEUE} from the Originate (outbound) or as the
; inbound-route response (inbound). Leaving it in place indefinitely is a hazard: a bug that
; resolves an empty queue name would silently fall back to a shared queue and quietly restore the
; exact cross-tenant leak this change removes.
;
; The per-tenant queue rows in Postgres carry these same settings verbatim, so behaviour is
; unchanged - only the isolation differs.
[campaign_agents]
musicclass = default ; verify a MOH class/files actually exist on this box (musiconhold.conf)
strategy = leastrecent
timeout = 20 ; per-member ring timeout, seconds
retry = 3
maxlen = 0 ; no hard cap on hold-queue length
joinempty = no ; 0 members online -> Queue() returns immediately to the dialplan's queue_fallback
leavewhenempty = yes ; last member logs out mid-wait -> also falls through to queue_fallback
ringinuse = no ; never ring a member Asterisk already believes is on a call
setinterfacevar = yes
