; =========================================================================
; Asterisk Dialplan Template - Voice Broadcasting & Campaign Manager
; =========================================================================

[general]
static=yes
writeprotect=no

[globals]
TRUNK=PJSIP/DinstarTrunk
; Public base URL of the Node backend (Render). Used ONLY by the DTMF-9 opt-out webhook below -
; NOT for a mid-call status callback (an earlier version of this file had one right after
; Answer(), which raced the worker's own AMI Hangup-event tracking and made a still-busy SIM
; port look free early - see git history). This CURL() fires once, near the very end of the
; call, right before Hangup() - it cannot race dial_status the same way.
CAMPAIGN_CALLBACK_BASE=https://REPLACE_WITH_YOUR_RENDER_URL
; NOTE: there is deliberately no global AGENT_QUEUE any more. Each client has their OWN queue
; (see the realtime `queues` table + extconfig.conf), and the queue name arrives per call:
;   - outbound: as the ${AGENT_QUEUE} channel variable set by the Originate
;     (backend/bulkCampaignWorker.js's dispatchLead, from the campaign's tenant)
;   - inbound:  as the response body of /api/voice/inbound-route below
;
; A single global queue shared by every tenant is what used to be here, and it meant Client A's
; caller pressing 1 could be answered by Client B's agent - the dialplan has no way to tell the
; two apart, so the queue name has to come from the backend, which does.
; Must exactly match CAMPAIGN_WEBHOOK_SECRET on the backend (see backend/.env.example) - without
; this, /api/campaigns/optout is reachable by anyone who finds the URL, not just Asterisk. Leaving
; this as the placeholder value is equivalent to leaving the secret unset on the backend (soft-
; enforced, unauthenticated) - see backend/middleware/webhookAuth.js.
CAMPAIGN_WEBHOOK_SECRET=REPLACE_WITH_YOUR_WEBHOOK_SECRET

; Context for INTERNAL / agent-to-agent dialling only (one softphone dialling another by
; extension). Inbound calls from the Dinstar trunk do NOT land here - they go to
; [inbound-context] below, because blind-Dialling the dialled digits as a PJSIP extension is
; meaningless for a real caller from the PSTN.
[incoming-webrtc-context]
exten => _X.,1,NoOp(Internal WebRTC Call from ${CALLERID(num)} to ${EXTEN})
same => n,Answer()
same => n,Dial(PJSIP/${EXTEN},30)
same => n,Hangup()

; =========================================================================
; Inbound PSTN calls arriving from the Dinstar gateway
; =========================================================================
; Entry context for [DinstarTrunk] (see pjsip.conf). Asks the backend whether to take the call,
; then puts it into the same agent queue the outbound press-1 transfer uses, so there is exactly
; one agent-routing mechanism rather than two that can drift apart.
;
; The backend endpoint answers in PLAIN TEXT ("reject" or "queue"), not JSON - CURL() has no JSON
; parser, and trying to regex a JSON body inside the dialplan is how this kind of integration
; rots. See GET /api/voice/inbound-route in backend/server.js.
[inbound-context]
exten => _X.,1,Goto(s,1)
exten => _+X.,1,Goto(s,1)

exten => s,1,NoOp(Inbound call from ${CALLERID(num)} to ${EXTEN} via DinstarTrunk)
same => n,Answer()
; URIENCODE the caller id: a leading '+' on an E.164 number would otherwise decode as a space
; in the query string and the backend would see the wrong number.
same => n,Set(ROUTE=${CURL(${CAMPAIGN_CALLBACK_BASE}/api/voice/inbound-route?caller=${URIENCODE(${CALLERID(num)})}&did=${URIENCODE(${EXTEN})}&trunk=DinstarTrunk&secret=${CAMPAIGN_WEBHOOK_SECRET})})
same => n,NoOp(Inbound route decision: '${ROUTE}')
; ROUTE is either the literal "reject" or the NAME OF THIS CLIENT'S OWN QUEUE. The backend has to
; supply the name because only it knows which tenant owns the trunk this call arrived on.
;
; FAILS CLOSED, unlike the earlier version of this block. Failing open used to mean "queue the
; caller anyway if the backend is unreachable", which was safe only while one global queue
; existed - now it would mean guessing whose agents should answer, and a wrong guess hands one
; company's customer to another company's agent. An empty ROUTE therefore goes to the fallback
; prompt, not to a queue.
same => n,GotoIf($["${ROUTE}" = "reject"]?rejected,1)
same => n,GotoIf($["${ROUTE}" = ""]?inbound_fallback,1)
same => n,Queue(${ROUTE},t,,,90)
same => n,Goto(inbound_fallback,1) ; only reached if Queue() returns (empty/timeout/error)

exten => rejected,1,NoOp(Inbound call rejected by backend - spam list or unmapped trunk)
same => n,Playback(campaign_audio/agents_unavailable)
same => n,Hangup()

exten => inbound_fallback,1,NoOp(No agent available for inbound call from ${CALLERID(num)})
same => n,Playback(campaign_audio/agents_unavailable)
same => n,Hangup()

; Context triggered by Backend Campaign Manager via AMI call origination.
; CAMPAIGN_AUDIO_FILE is the extension-less basename of a WAV pushed by the backend into this
; box's custom sounds directory (see ASTERISK_SOUNDS_DIR in backend/.env.example) - it is NOT
; a filesystem path anymore. LEAD_ID/CAMP_ID arrive as plain channel variables set by the
; Originate itself (bulkCampaignWorker.js's dispatchLead) - no need to re-Set them here.
[campaign-broadcast-context]
exten => _X.,1,Goto(s,1)
exten => _+X.,1,Goto(s,1)

exten => s,1,NoOp(Campaign Outbound Call Answered)
same => n,Answer()
same => n,Goto(human,1)

; No AMD/machine-vs-human split - the delay AMD needs to listen before deciding costs several
; real seconds of dead air before the caller hears anything, which was slower to the ear than a
; machine occasionally hearing the full interactive prompt is worth. Every pickup gets the same
; instant, interruptible prompt + DTMF menu. (Label kept as "human" - DTMF "2" below jumps to
; human,replay to repeat the message.)
exten => human,1,NoOp(Instant interruptible prompt + DTMF menu)
same => n(replay),Set(TIMEOUT(digit)=5)
same => n,Set(TIMEOUT(response)=6)
same => n,Background(campaign_audio/${CAMPAIGN_AUDIO_FILE}) ; interruptible, unlike Playback()
same => n,GotoIf($["${PLAYBACKSTATUS}" = "FAILED"]?playback_failed,1)
same => n,WaitExten(6) ; catches a digit pressed during Background() too, not just after
same => n,Goto(done,1) ; prompt finished, no digit pressed

exten => playback_failed,1,NoOp(Campaign audio file missing or unplayable: campaign_audio/${CAMPAIGN_AUDIO_FILE})
same => n,Playback(pbx-invalid) ; Audible fallback instead of silent dead air
same => n,Goto(done,1)

; --- DTMF branches (matched by WaitExten above) ---

exten => 1,1,NoOp(DTMF 1 - transfer to this client's agent queue '${AGENT_QUEUE}')
same => n,UserEvent(AgentTransferStart,LeadId: ${LEAD_ID},Uniqueid: ${CHANNEL(uniqueid)})
; Empty when the campaign's client has no agents on their plan, or is deactivated. Calling
; Queue() with no name would be an error; more importantly, there is no shared queue left to fall
; back to on purpose - a fallback default is exactly how cross-tenant routing would creep back in.
same => n,GotoIf($["${AGENT_QUEUE}" = ""]?queue_fallback,1)
same => n,Queue(${AGENT_QUEUE},t,,,90)
same => n,Goto(queue_fallback,1) ; only reached if Queue() returns (empty/timeout/error)

exten => 2,1,NoOp(DTMF 2 - repeat message)
same => n,Goto(human,replay)

exten => 9,1,NoOp(DTMF 9 - opt out / do-not-call)
same => n,Set(OPTOUT_RESULT=${CURL(${CAMPAIGN_CALLBACK_BASE}/api/campaigns/optout?leadId=${LEAD_ID}&phone=${CALLERID(num)}&secret=${CAMPAIGN_WEBHOOK_SECRET})})
same => n,Playback(campaign_audio/optout_confirmation)
same => n,Goto(done,1)

exten => t,1,NoOp(No DTMF pressed within the WaitExten timeout)
same => n,Goto(done,1)

exten => i,1,NoOp(Invalid/unmapped digit - re-offer the menu)
same => n,Goto(human,replay)

exten => queue_fallback,1,NoOp(Agent queue empty, unavailable, or timed out)
same => n,Playback(campaign_audio/agents_unavailable)
same => n,Goto(done,1)

exten => done,1,NoOp(Campaign call complete)
same => n,Hangup()

; Workstream 8: entry point for IVR-flow campaigns (client-configurable flows interpreted by
; ivrFlowEngine.js over ARI). bulkCampaignWorker.js Originates into this context instead of
; campaign-broadcast-context above whenever the lead's campaign has voice_campaigns.ivr_flow_id
; set - see ivrController.js's activateFlow(). AMD still runs here first (dialplan-only, no ARI
; equivalent) so AMDSTATUS/AMDCAUSE are already set as channel variables before Stasis() -
; ivrFlowEngine.js's amd_check node just reads AMDSTATUS back via ariService.getChannelVar()
; rather than re-running AMD() a second time.
[ivr-campaign-context]
exten => _X.,1,Goto(s,1)
exten => _+X.,1,Goto(s,1)

; Workstream 9: NEEDS_AMD is set per-dispatch by bulkCampaignWorker.js (a cheap check for
; whether the target flow has an amd_check node) - AMD() costs several real seconds of dead air
; before the caller hears anything, since it must listen to real audio before it can decide
; human vs. machine, so flows that never read ${AMDSTATUS} skip it entirely for a faster pickup.
exten => s,1,NoOp(IVR Flow Campaign Call Answered - Flow ${FLOW_ID})
same => n,Answer()
same => n,GotoIf($["${NEEDS_AMD}" = "true"]?run_amd,1:enter_stasis,1)

exten => run_amd,1,NoOp(Flow uses amd_check - running AMD before Stasis)
same => n,Wait(1) ; Brief pause to establish audio stream before AMD's own analysis window
same => n,AMD() ; Answering-machine detection - sets ${AMDSTATUS}/${AMDCAUSE}
same => n,UserEvent(AMDResult,LeadId: ${LEAD_ID},Status: ${AMDSTATUS},Cause: ${AMDCAUSE})
same => n,Goto(enter_stasis,1)

; LANGUAGE_CODE (also set by bulkCampaignWorker.js, from the lead's own language_code) is read
; by ivrFlowEngine.js directly as a channel variable via ARI (same pattern as AMDSTATUS below),
; not as a Stasis() positional arg - a trailing empty positional arg can silently get dropped by
; Asterisk, which lost the language on some calls when this was first tried that way.
exten => enter_stasis,1,Stasis(ivr_engine,${FLOW_ID},${LEAD_ID})
same => n,Goto(done,1) ; only reached if Stasis() returns without ivrFlowEngine.js already hanging up

exten => done,1,NoOp(IVR flow campaign call complete)
same => n,Hangup()

; Workstream 8: transfer_queue node target. ivrFlowEngine.js hands the channel back to the
; dialplan here via ariService.continueInDialplan() (extension = the queue name), since Queue()
; has no ARI equivalent - Workstream 7's Queue()/queueMembershipService.js bridging mechanism is
; reused unchanged here rather than reimplemented over ARI. The channel's Uniqueid stays stable
; across this handoff, so bulkCampaignWorker.js's existing Hangup-based completion tracking
; (including the long-transfer-call timeout) keeps working with no changes needed there.
; ${EXTEN} here is the flow OWNER'S queue name, resolved by ivrFlowEngine.js from the flow's
; tenant_id - never from the flow's own node config, which is client-authored and used to be read
; straight into this queue name. The engine sends the channel to the literal extension "fallback"
; below when that client has no agent queue.
[ivr-transfer-context]
exten => _X.,1,NoOp(IVR flow transfer to queue ${EXTEN})
same => n,Queue(${EXTEN},t,,,90)
same => n,Goto(fallback,1) ; only reached if Queue() returns (empty/timeout/error)

exten => fallback,1,NoOp(Agent queue empty, unavailable, or timed out)
same => n,Playback(campaign_audio/agents_unavailable)
same => n,Hangup()
