; =========================================================================
; PJSIP Configuration Template - Low Latency WebRTC & Transcoding Avoidance
; =========================================================================

[global]
type=global
user_agent=Enterprise-Contact-Center

[system]
type=system
; QoS prioritization tags for audio packets (VIP priority routing)
tos_audio=ef
cos_audio=5

; WebSocket/WSS Transport setup
; Confirmed live (Workstream 7): needs the exact same external_media_address/
; external_signaling_address/local_net fix as [transport-udp] below, for the exact same
; reason - without it, WebRTC signaling completes fine (the SIP/SDP exchange succeeds, the
; call shows "Up") but Asterisk advertises its private AWS IP as the ICE/media candidate,
; which the agent's browser can never reach - the call connects but no audio flows in either
; direction. This is NOT the TLS cert config (that's http.conf, see README workstream 7).
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
external_media_address=13.205.220.6
external_signaling_address=13.205.220.6
local_net=172.31.0.0/16

; Standard UDP Transport for Gateway trunk connections
; external_media_address/external_signaling_address make Asterisk advertise its PUBLIC EC2 IP
; in Contact headers and SDP instead of the private AWS VPC address (172.31.x.x) that no
; remote peer (Dinstar, or anything outside this VPC) can ever reach. Without this, even a
; call that connects has broken audio/signaling because the far end tries to talk back to an
; address it cannot route to. Replace 13.205.220.6 if the EC2 instance's public IP changes
; (e.g. after a stop/start on a non-Elastic-IP instance).
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=13.205.220.6
external_signaling_address=13.205.220.6
local_net=172.31.0.0/16

; Generic template for WebRTC agent endpoints
; Note: Real endpoints can be fetched dynamically via Asterisk Realtime (ARA)
[webrtc_agent_template](!)
type=endpoint
transport=transport-wss
context=incoming-webrtc-context
webrtc=yes
use_avpf=yes
ice_support=yes
media_encryption=dtls
dtls_verify=no
dtls_setup=actpass
dtls_auto_generate_cert=yes
rtcp_mux=yes
; FORCE G.711 (alaw/ulaw) codec. Strictly disable Opus to prevent transcoding delays/CPU usage.
disallow=all
allow=alaw,ulaw

; AOR configuration template
[webrtc_aor_template](!)
type=aor
max_contacts=1
remove_existing=yes

; Authentication configuration template
[webrtc_auth_template](!)
type=auth
auth_type=userpass

; NOTE: agent endpoints are NOT declared statically here. They are provisioned per-agent into
; Postgres (ps_endpoints / ps_auths / ps_aors) by backend/services/agentProvisioningService.js and
; read back by Asterisk Realtime - see sorcery.conf and res_pgsql.conf. A static [1001] debug
; endpoint used to live here and was removed: it carried a real password in a public repo and
; duplicated the realtime mechanism.

; =========================================================================
; Dinstar Gateway SIP Trunk Configuration
; =========================================================================
;
; REGISTRATION-BASED, deliberately. The gateway registers itself TO Asterisk, so its contact
; address is learned dynamically from that registration.
;
; The previous design pinned the trunk to the office router's public WAN IP, in both a static
; `contact=` on the AOR and a `match=` on an [identify] section. That IP is dynamic and the
; NAT source port (1024) was never a fixed forward, so the whole trunk silently died every time
; the office network re-NATted - it happened three times in production
; (171.50.246.172 -> 171.50.245.138 -> 106.201.243.110), each time presenting as "gateway
; offline / no outbound calls" and each time needing a live tcpdump to diagnose.
; Registration removes that entire failure class: the WAN IP can change freely and the next
; REGISTER just updates the contact.
;
; The Dinstar must be configured to register to this box (SIP server 13.205.220.6:5060,
; register = on, expiry 120-300s) using the username/password in [DinstarTrunk_auth] below.

[DinstarTrunk]
type=aor
; No static contact - supplied by the gateway's REGISTER. remove_existing keeps exactly one
; live contact so a re-registration from a new WAN IP replaces the old one instead of
; accumulating stale contacts Asterisk would keep trying to route to.
max_contacts=1
remove_existing=yes
; Detect a dead gateway rather than blackholing calls into a stale contact.
qualify_frequency=60

[DinstarTrunk]
type=endpoint
transport=transport-udp
; Inbound calls from the gateway land in the real inbound handler (see extensions.conf's
; [inbound-context]) - NOT incoming-webrtc-context, which is for internal/agent-to-agent dialling
; and would just blind-Dial the dialled digits as a PJSIP extension.
context=inbound-context
disallow=all
allow=alaw,ulaw
aors=DinstarTrunk
auth=DinstarTrunk_auth
outbound_auth=DinstarTrunk_auth
force_rport=yes
rewrite_contact=yes
direct_media=no

[DinstarTrunk_auth]
type=auth
auth_type=userpass
username=dinstar0
; PLACEHOLDER - the real password lives only in /etc/asterisk/pjsip.conf on the EC2 box and must
; match what the Dinstar is configured to register with. Never commit the real value: this file
; is in a public repo, and a leaked trunk password lets anyone register as this trunk and
; originate calls on your SIMs (toll fraud).
password=REPLACE_ON_SERVER_ONLY

; NOTE: there is deliberately no [DinstarTrunk_identify] section any more. Identify-by-IP is
; exactly what made this trunk fragile; the gateway is now authenticated by its registration
; credentials instead, which is both more robust and more secure.
