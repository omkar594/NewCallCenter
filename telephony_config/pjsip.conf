; =========================================================================
; PJSIP Configuration Template - Low Latency WebRTC & Transcoding Avoidance
; =========================================================================

[global]
type=global
user_agent=Enterprise-Contact-Center

[system]
type=system
; QoS prioritization tags for audio packets (VIP priority routing)
tos_audio=ef
cos_audio=5

; WebSocket/WSS Transport setup
; Confirmed live (Workstream 7): needs the exact same external_media_address/
; external_signaling_address/local_net fix as [transport-udp] below, for the exact same
; reason - without it, WebRTC signaling completes fine (the SIP/SDP exchange succeeds, the
; call shows "Up") but Asterisk advertises its private AWS IP as the ICE/media candidate,
; which the agent's browser can never reach - the call connects but no audio flows in either
; direction. This is NOT the TLS cert config (that's http.conf, see README workstream 7).
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089
external_media_address=13.205.220.6
external_signaling_address=13.205.220.6
local_net=172.31.0.0/16

; Standard UDP Transport for Gateway trunk connections
; external_media_address/external_signaling_address make Asterisk advertise its PUBLIC EC2 IP
; in Contact headers and SDP instead of the private AWS VPC address (172.31.x.x) that no
; remote peer (Dinstar, or anything outside this VPC) can ever reach. Without this, even a
; call that connects has broken audio/signaling because the far end tries to talk back to an
; address it cannot route to. Replace 13.205.220.6 if the EC2 instance's public IP changes
; (e.g. after a stop/start on a non-Elastic-IP instance).
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=13.205.220.6
external_signaling_address=13.205.220.6
local_net=172.31.0.0/16

; Generic template for WebRTC agent endpoints
; Note: Real endpoints can be fetched dynamically via Asterisk Realtime (ARA)
[webrtc_agent_template](!)
type=endpoint
transport=transport-wss
context=incoming-webrtc-context
webrtc=yes
use_avpf=yes
ice_support=yes
media_encryption=dtls
dtls_verify=no
dtls_setup=actpass
dtls_auto_generate_cert=yes
rtcp_mux=yes
; FORCE G.711 (alaw/ulaw) codec. Strictly disable Opus to prevent transcoding delays/CPU usage.
disallow=all
allow=alaw,ulaw

; AOR configuration template
[webrtc_aor_template](!)
type=aor
max_contacts=1
remove_existing=yes

; Authentication configuration template
[webrtc_auth_template](!)
type=auth
auth_type=userpass

; =========================================================================
; Example static declaration for verification/local debugging
; =========================================================================

[1001]
type=endpoint
allow=alaw,ulaw
context=incoming-webrtc-context
dtls_auto_generate_cert=yes
dtls_setup=actpass
dtls_verify=no
ice_support=yes
media_encryption=dtls
rtcp_mux=yes
transport=transport-wss
use_avpf=yes
webrtc=yes
aors=1001
auth=1001_auth

[1001]
type=aor
max_contacts=1
remove_existing=yes

[1001_auth]
type=auth
auth_type=userpass
username=1001
password=secure_agent_password_1001

; =========================================================================
; Dinstar Gateway SIP Trunk Configuration
; =========================================================================

[DinstarTrunk]
type=aor
; Dinstar sits behind NAT on a private LAN; EC2 cannot route to its private IP directly, so
; this must be whatever WAN address+port Asterisk actually sees inbound traffic arrive from.
; The port here (1024, not the standard 5060) confirms this is a NAT-translated port, not a
; fixed static forward - it DOES change when the office network's NAT mapping changes (this
; exact thing happened live: the gateway's WAN IP moved from 171.50.246.172 to 171.50.245.138
; sometime after 2026-08-03, which silently broke both inbound heartbeats and outbound calls
; until diagnosed via a live tcpdump capture and fixed here + on the EC2 box directly).
contact=sip:171.50.245.138:1024

[DinstarTrunk]
type=endpoint
transport=transport-udp
context=incoming-webrtc-context
disallow=all
allow=alaw,ulaw
aors=DinstarTrunk
outbound_auth=DinstarTrunk_auth
force_rport=yes
direct_media=no

[DinstarTrunk_auth]
type=auth
auth_type=userpass
username=dinstar0
password=Dst!Trk#9271vX

[DinstarTrunk_identify]
type=identify
endpoint=DinstarTrunk
; Must match the address Asterisk actually SEES inbound packets arrive from - the office
; router's current public WAN IP, not Dinstar's own private LAN address. This value moves
; whenever that router's WAN IP changes - if the gateway looks "offline" again, check a live
; tcpdump on port 5060 for the real source IP of its heartbeat OPTIONS before assuming anything
; else is wrong (this exact symptom was fully explained by a stale IP here once already).
match=171.50.245.138
